name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fail=1; fi
          done < <(find scripts -name '*.sh' | sort)
          exit $fail

      - name: Markdown links and anchors
        run: python3 tools/check-links.py

      - name: Charge report on fixtures
        run: bash scripts/diagnostics/charge-report.sh --all tests/fixtures/sample-charge.csv

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning $(find scripts -name '*.sh')
